name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Matches gradle/gradle-daemon-jvm.properties (Java 21, Azul), so Gradle downloads no JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Only main writes the cache; PRs read it, so branches do not evict each other's entries.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # No local.properties here: AGP finds the Android SDK through the runner's ANDROID_HOME.
      - run: ./gradlew :core:jvmTest :server:test :app:shared:testAndroidHostTest

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: '**/build/reports/tests/'

  # A separate job, so a cold ChromeHeadless does not share the CPU with Android compilation:
  # that contention is what used to break the Karma timeouts in the full build.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - run: >-
          ./gradlew
          :core:jsBrowserTest :core:wasmJsBrowserTest
          :app:shared:jsBrowserTest :app:shared:wasmJsBrowserTest

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-reports
          path: '**/build/reports/tests/'

  # Kotlin/Native simulator tests only run on macOS. Debug simulator binaries only: release
  # framework linking is what ran out of memory before, and this runner has about 7 GB.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # The log records which Xcode versions the image really has; AGENTS.md requires 26+.
      - name: Select Xcode 26.6
        run: |
          ls /Applications | grep Xcode
          if ! xcodebuild -version | grep -q '^Xcode 26\.6$'; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The Kotlin/Native toolchain and its dependencies live outside ~/.gradle. Like the Gradle
      # cache, every branch reads it and only main writes it: a PR entry (~415 MB) would be
      # visible to that PR alone and eat into the repository's 10 GB cache limit.
      - id: konan
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - run: ./gradlew :core:iosSimulatorArm64Test :app:shared:iosSimulatorArm64Test

      # An exact hit is already stored under this key; saving it again would only warn.
      - if: github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: '**/build/reports/tests/'
