# Fly.io config for the ReadShelf backend.
#
# JWT_SECRET is deliberately absent: it is a secret, set once with
#   fly secrets set JWT_SECRET=<generated locally>
# and kept in Fly's secret store. It must never appear in this file, the Dockerfile or the repo.
#
# CORS_ALLOWED_ORIGINS is not a secret, so it lives here where a reviewer can see which origin
# the API admits. An unset value would fail closed to localhost, which in production means the
# web client silently stops working — so it is pinned explicitly.

app = "readshelf-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CORS_ALLOWED_ORIGINS = "https://readshelf.pages.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # A portfolio demo is idle most of the time; the first visitor after a pause pays a few
  # seconds of cold start, which is the trade for not renting an always-on machine.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
